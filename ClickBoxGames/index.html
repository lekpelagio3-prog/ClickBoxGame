<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click Box Challenge</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='15' fill='%23d21f3c'/%3E%3Cpath d='M22 15v29l8-8 6 14 7-3-6-13h12z' fill='white'/%3E%3C/svg%3E">
</head>
<body>
  <header class="brand-header">
    <svg class="brand-logo" viewBox="0 0 64 64" role="img" aria-labelledby="logo-title">
      <title id="logo-title">Click Box Challenge logo</title>
      <defs>
        <linearGradient id="logo-gradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff6a6a"></stop>
          <stop offset="60%" stop-color="#d21f3c"></stop>
          <stop offset="100%" stop-color="#9b0d29"></stop>
        </linearGradient>
      </defs>
      <rect x="3" y="3" width="58" height="58" rx="17" fill="url(#logo-gradient)"></rect>
      <path d="M22 14v31l8-8 6 14 7-3-6-13h12z" fill="#fff"></path>
      <path d="m48 9 1.8 4.2L54 15l-4.2 1.8L48 21l-1.8-4.2L42 15l4.2-1.8z" fill="#fff7a8"></path>
    </svg>
    <h1>Click Box Challenge</h1>
  </header>

  <div class="controls">
    <label for="difficulty">Difficulty:</label>
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="normal" selected>Normal</option>
      <option value="hard">Hard</option>
    </select>
  </div>

  <div id="game-area">
    <div id="box"></div>
  </div>

  <div class="stats-panel">
    <div class="stat-card">
      <span class="label">Score</span>
      <span id="score" class="value">0</span>
    </div>
    <div class="stat-card">
      <span class="label">Level</span>
      <span id="level" class="value">1</span>
    </div>
    <div class="stat-card">
      <span class="label">Time Left</span>
      <span id="time" class="value">30</span>
    </div>
    <div class="stat-card">
      <span class="label">Highest</span>
      <span id="highScore" class="value">0</span>
    </div>
  </div>

  <button id="restart-btn" type="button">Play Again</button>

  <!-- Sound effect -->
  <audio id="clickSound" src="freesound_community-button-pressed-38129 - Copy.mp3"></audio>
  <script src="script.js"></script>
</body>
</html>
